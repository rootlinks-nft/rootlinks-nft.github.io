name: render-art
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-art
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/render/requirements.txt
      - run: pip install -r .github/render/requirements.txt
      - name: Render missing images from chain state
        run: python .github/render/sync.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- art
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "render: $(git diff --cached --name-only --diff-filter=A -- art | wc -l) new image(s)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
